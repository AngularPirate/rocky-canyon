<style>
:root{
  --bg:#E9EBEE;--panel:#FFF;--panel-2:#F3F5F7;--line:#D4D9DF;--soft:#E5E9ED;
  --ink:#141A1F;--ink-2:#3D4750;--mute:#6B7681;
  --gold:#A9700D;--gold-bg:#F7E9CB;--gold-ln:#DDBB6C;
  --sage:#357056;--sage-bg:#DAEBE1;--sage-ln:#8CBBA3;
  --blue:#295C87;--blue-bg:#D9E6F1;--blue-ln:#88AECB;
  --clay:#9C4732;--clay-bg:#F4DED7;--clay-ln:#D49483;
  --rest:#78838C;--rest-bg:#E8EBEE;--rest-ln:#C8CFD5;
  --sh:0 1px 2px rgba(20,26,31,.05),0 6px 20px -12px rgba(20,26,31,.25);--nav:#FFF;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1014;--panel:#151A20;--panel-2:#1B2128;--line:#293139;--soft:#222931;
  --ink:#E5EAEF;--ink-2:#B2BCC5;--mute:#7F8B96;
  --gold:#E3A93E;--gold-bg:#2E2513;--gold-ln:#5E4A1D;
  --sage:#71B992;--sage-bg:#152D1E;--sage-ln:#2C5840;
  --blue:#6DA9DA;--blue-bg:#132636;--blue-ln:#294A68;
  --clay:#E29076;--clay-bg:#301811;--clay-ln:#67382A;
  --rest:#8B959E;--rest-bg:#1C232A;--rest-ln:#313A43;
  --sh:0 1px 2px rgba(0,0,0,.45),0 8px 24px -14px rgba(0,0,0,.85);--nav:#12171C;
}}
:root[data-theme="dark"]{
  --bg:#0C1014;--panel:#151A20;--panel-2:#1B2128;--line:#293139;--soft:#222931;
  --ink:#E5EAEF;--ink-2:#B2BCC5;--mute:#7F8B96;
  --gold:#E3A93E;--gold-bg:#2E2513;--gold-ln:#5E4A1D;
  --sage:#71B992;--sage-bg:#152D1E;--sage-ln:#2C5840;
  --blue:#6DA9DA;--blue-bg:#132636;--blue-ln:#294A68;
  --clay:#E29076;--clay-bg:#301811;--clay-ln:#67382A;
  --rest:#8B959E;--rest-bg:#1C232A;--rest-ln:#313A43;
  --sh:0 1px 2px rgba(0,0,0,.45),0 8px 24px -14px rgba(0,0,0,.85);--nav:#12171C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4,h5{font-family:Archivo,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.012em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eb{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit}
.hd{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.hd-in{max-width:600px;margin:0 auto;padding:9px 15px;display:flex;align-items:center;gap:11px}
.hd .wk{font-family:Archivo,sans-serif;font-size:15px;font-weight:700;line-height:1.1}
.hd .ph{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.hd .rt{margin-left:auto;text-align:right}
.hd .rt b{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;color:var(--gold);display:block;line-height:1}
.hd .rt span{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--mute);letter-spacing:.09em;text-transform:uppercase}
main{max-width:600px;margin:0 auto;padding:15px 15px 96px}
.pane{display:none}.pane.on{display:block}
.c{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.c-h{padding:13px 16px 11px;border-bottom:1px solid var(--soft)}
.c-h h3{font-size:16px;font-weight:700}
.c-h p{margin:3px 0 0;font-size:13px;color:var(--mute);line-height:1.4}
.c-p{padding:15px 16px}
.sess{padding:15px 16px;border-bottom:1px solid var(--soft)}
.sess:last-child{border-bottom:0}
.sess.done{background:var(--panel-2)}
.sess-t{display:flex;gap:9px;align-items:flex-start}
.chip{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;white-space:nowrap;flex:0 0 auto;margin-top:2px}
.k-easy{background:var(--sage-bg);color:var(--sage);border:1px solid var(--sage-ln)}
.k-hard{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-ln)}
.k-long{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-ln)}
.k-str{background:var(--clay-bg);color:var(--clay);border:1px solid var(--clay-ln)}
.k-rest{background:var(--rest-bg);color:var(--rest);border:1px solid var(--rest-ln)}
.sess h4{font-size:16px;font-weight:600;line-height:1.28}
.sess p{margin:6px 0 0;font-size:14px;color:var(--ink-2);line-height:1.45}
.sess .tm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--mute);letter-spacing:.06em;margin-bottom:3px}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--panel);font-family:Archivo,sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;transition:.13s}
.btn:active{transform:scale(.985)}
.btn.go{border-color:var(--sage);color:var(--sage)}
.btn.is{background:var(--sage);border-color:var(--sage);color:#fff}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{padding:17px 16px 16px;background:linear-gradient(160deg,var(--panel-2),var(--panel))}
.hero .dt{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.hero .dt b{font-family:Archivo,sans-serif;font-size:23px;font-weight:700}
.hero .dt span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute)}
.strip{display:flex;gap:5px;margin-top:13px}
.sq{flex:1;height:5px;border-radius:3px;background:var(--soft)}
.sq.f{background:var(--sage)}.sq.t{background:var(--gold)}
/* exercise table */
.exs{margin-top:13px;border:1px solid var(--soft);border-radius:10px;overflow:hidden}
.ex{display:grid;grid-template-columns:24px 1fr 66px;gap:9px;padding:11px 11px;align-items:start;border-bottom:1px solid var(--soft)}
.ex:last-child{border-bottom:0}
.ex.dn{background:var(--panel-2)}
.ex.dn .exn{color:var(--mute);text-decoration:line-through}
.exn{font-size:14.5px;font-weight:600;line-height:1.25}
.exm{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--gold);margin-top:2px;letter-spacing:.02em}
.exc{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.38}
.exl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--sage);margin-top:3px}
.exw{width:66px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:15px;text-align:center}
.exw:focus{outline:2px solid var(--gold);outline-offset:-1px}
.tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border:1.5px solid var(--line);
  border-radius:6px;background:var(--panel);cursor:pointer;position:relative;flex:0 0 auto}
.tick:checked{background:var(--sage);border-color:var(--sage)}
.tick:checked::after{content:"";position:absolute;left:6.5px;top:2.5px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.tick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.exhd{display:flex;gap:8px;align-items:center;padding:9px 11px;background:var(--panel-2);border-bottom:1px solid var(--soft)}
.exhd .eb{flex:1}
.vsw{display:flex;gap:4px;flex:0 0 auto}
.vsw button{padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);cursor:pointer}
.vsw button.on{background:var(--clay);border-color:var(--clay);color:#fff}
.vsw button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
/* log form */
.lg{padding:14px 16px;background:var(--panel-2);border-top:1px solid var(--soft)}
.rowf{display:flex;gap:9px;margin-bottom:10px}
.fld{flex:1}
.fld label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px;font-weight:600}
.fld input,.fld textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
.fld textarea{font-size:15px;resize:vertical;min-height:54px;font-family:inherit}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.scale{display:flex;gap:5px}
.sc{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.sc.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sc.on[data-h="0"],.sc.on[data-h="1"]{background:var(--sage);border-color:var(--sage);color:#fff}
.sc.on[data-h="2"],.sc.on[data-h="3"]{background:var(--gold);border-color:var(--gold);color:#fff}
.sc.on[data-h="4"]{background:var(--clay);border-color:var(--clay);color:#fff}
.savd{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--sage);letter-spacing:.06em;margin-top:8px;height:12px}
/* week */
.dayr{display:grid;grid-template-columns:46px 1fr;border-bottom:1px solid var(--soft)}
.dayr:last-child{border-bottom:0}
.dayr.tdy{background:var(--gold-bg)}
.dl{padding:13px 0 13px 14px;border-right:1px solid var(--soft)}
.dl b{font-family:Archivo,sans-serif;font-size:13px;display:block}
.dl span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mute)}
.di{padding:11px 14px}
.di .it{display:flex;gap:8px;align-items:flex-start;padding:7px 0;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.di .it b{font-size:14px;font-weight:600;line-height:1.3;flex:1}
.di .it.dn b{color:var(--mute);text-decoration:line-through}
.di .it .cv{color:var(--mute);flex:0 0 auto;margin-top:3px;transition:transform .18s}
.di .it.op .cv{transform:rotate(180deg)}
.di .it:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.itd{display:none;padding:2px 0 12px 30px}
.itd.op{display:block}
.itd .tmz{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--mute);letter-spacing:.06em;margin-bottom:5px}
.itd p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.47}
.exr{padding:10px 11px;border-bottom:1px solid var(--soft)}
.exr:last-child{border-bottom:0}
.mini{margin-top:11px;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);
  font-family:Archivo,sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.mini.go{border-color:var(--sage);color:var(--sage)}
.mini.is{background:var(--sage);border-color:var(--sage);color:#fff}
.wknav{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--soft);background:var(--panel-2)}
.wknav button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center}
.wknav button:disabled{opacity:.3}
.wknav .mid{flex:1;text-align:center}
.wknav .mid b{font-family:Archivo,sans-serif;font-size:14.5px;font-weight:700;display:block;line-height:1.2}
.wknav .mid span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--mute)}
/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line)}
.st{background:var(--panel);padding:14px 10px;text-align:center}
.st b{font-family:Archivo,sans-serif;font-size:24px;font-weight:700;display:block;line-height:1}
.st span{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:block;margin-top:5px}
.chart{padding:14px 16px 10px}
.cbars{display:flex;align-items:flex-end;gap:3px;height:96px}
.cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0;position:relative}
.cb .pl{background:var(--soft);border-radius:2px 2px 0 0}
.cb .ac{background:var(--sage);border-radius:2px 2px 0 0;position:absolute;bottom:12px;left:0;right:0}
.cb .lb{font-family:"IBM Plex Mono",monospace;font-size:8px;color:var(--mute);text-align:center;height:10px}
.cb.now .lb{color:var(--gold);font-weight:600}
.lgnd{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
.lgnd i{display:flex;align-items:center;gap:6px;font-style:normal;font-size:11.5px;color:var(--mute)}
.lgnd i s{width:10px;height:10px;border-radius:3px;text-decoration:none}
.hipr{display:flex;gap:2px;align-items:flex-end;height:44px;margin-top:6px}
.hipr div{flex:1;border-radius:2px;min-width:2px}
/* coach */
.msgs{padding:14px 16px;display:flex;flex-direction:column;gap:11px;min-height:140px}
.msg{max-width:88%;padding:11px 13px;border-radius:13px;font-size:14.5px;line-height:1.48;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--panel);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel-2);border:1px solid var(--soft);border-bottom-left-radius:4px;color:var(--ink-2)}
.qs{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 13px}
.q{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;color:var(--ink-2)}
.ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--soft);background:var(--panel-2)}
.ask input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
.ask input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.ask button{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ask button:disabled{opacity:.4}
/* accordion */
.ac-h{width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;background:none;border:0;cursor:pointer;text-align:left}
.ac-h h3{font-size:15.5px;font-weight:600;flex:1}
.ac-h svg{color:var(--mute);transition:transform .18s;flex:0 0 auto}
.c.open .ac-h svg{transform:rotate(180deg)}
.ac-b{display:none;padding:0 16px 16px;border-top:1px solid var(--soft);padding-top:14px}
.c.open .ac-b{display:block}
.ac-b h5{font-size:13.5px;font-weight:600;margin:15px 0 6px}
.ac-b h5:first-child{margin-top:0}
.ac-b p{margin:0 0 10px;font-size:14px;color:var(--ink-2);line-height:1.5}
.ac-b ul{margin:0 0 11px;padding-left:19px;font-size:14px;color:var(--ink-2)}
.ac-b li{padding:2.5px 0}
.ac-b b{color:var(--ink)}
.ac-b a{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:11px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--soft);vertical-align:top;color:var(--ink-2)}
td.k{color:var(--ink);font-weight:600}
td.v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.scrl{overflow-x:auto}
.note{border-left:3px solid var(--gold);padding:3px 0 3px 13px;margin:12px 0;font-size:13.8px;color:var(--ink-2);line-height:1.48}
.note.red{border-color:var(--clay)}.note.grn{border-color:var(--sage)}
.tri{display:grid;grid-template-columns:9px 1fr;gap:11px;padding:11px 12px;border-radius:9px;background:var(--panel-2);border:1px solid var(--soft);margin-bottom:8px;align-items:start}
.tri i{width:9px;height:9px;border-radius:50%;margin-top:6px}
.tri b{display:block;font-family:Archivo,sans-serif;font-size:13.5px}
.tri span{font-size:13.3px;color:var(--ink-2);line-height:1.45}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nv{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nb{background:none;border:0;padding:9px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute)}
.nb.on{color:var(--gold)}
.nb span{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.sync{display:flex;align-items:center;gap:6px;justify-content:center;padding:9px 0 2px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--mute)}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--rest-ln)}.sdot.on{background:var(--sage)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<script>window.REVIEW=true;</script>
<div style="background:var(--gold-bg);border-bottom:1px solid var(--gold-ln);padding:9px 15px;text-align:center;font-size:12.5px;color:var(--gold);line-height:1.4">
<b>Review copy.</b> Read-only snapshot for feedback &mdash; logging and the AI coach live in the private version.
</div>
<div class="hd"><div class="hd-in">
  <div><div class="wk" id="h-wk">—</div><div class="ph" id="h-ph">—</div></div>
  <div class="rt"><b class="mono" id="h-cd">—</b><span>d to robie</span></div>
</div></div>
<main>
  <div class="pane on" id="p-today"></div>
  <div class="pane" id="p-week"></div>
  <div class="pane" id="p-prog"></div>
  <div class="pane" id="p-coach"></div>
  <div class="pane" id="p-plan"></div>
</main>
<nav><div class="nv" id="nav"></div>
  <div class="sync"><span class="sdot" id="sdot"></span><span id="smsg">review copy &middot; nothing saved</span></div>
</nav>

<script>
/* ═══ LIFTING ═══════════════════════════════ */

function rProg(){
 var done=0,tot=0,mi=0,hips=[],vol=0;
 for(var i=0;i<17;i++)for(var d=0;d<7;d++){
  sess(i,d).forEach(function(o){if(o.id){tot++;if(st.checks[o.id])done++}});
  var v=st.days["w"+i+"d"+d];if(v){if(v.mi)mi+=+v.mi;if(v.hip!=null&&i<=CUR)hips.push(v.hip)}}
 var streak=0,end=PRE?-1:CUR*7+TD;
 for(var k=end;k>=0;k--){var wi=Math.floor(k/7),di=k%7,ss=sess(wi,di).filter(function(o){return o.id});
  if(!ss.length)continue;
  if(ss.every(function(o){return st.checks[o.id]}))streak++;else{if(k===end)continue;break}}
 var mx=Math.max.apply(null,W.map(function(x){return x.t}));
 var bars=W.map(function(x,i){var act=0;
  for(var d=0;d<7;d++){var v=st.days["w"+i+"d"+d];if(v&&v.min)act+=+v.min}
  return '<div class="cb'+(i===CUR?" now":"")+'" title="Week '+(i+1)+': planned '+x.t+' min'+(act?", logged "+act:"")+'">'+
   '<div class="pl" style="height:'+Math.round(x.t/mx*72)+'px"></div>'+
   (act?'<div class="ac" style="height:'+Math.round(Math.min(act,mx)/mx*72)+'px"></div>':'')+
   '<div class="lb">'+(i+1)+'</div></div>'}).join("");
 var HC=["var(--sage)","var(--sage)","var(--gold)","var(--gold)","var(--clay)"];
 var hip=hips.slice(-42).map(function(n){return '<div style="height:'+(8+n*9)+'px;background:'+HC[n]+'"></div>'}).join("");
 var pct=tot?Math.round(done/tot*100):0;
 document.getElementById("p-prog").innerHTML=
 '<div class="c"><div class="stats"><div class="st"><b>'+done+'</b><span>sessions done</span></div>'+
  '<div class="st"><b style="color:var(--gold)">'+streak+'</b><span>day streak</span></div>'+
  '<div class="st"><b>'+(mi?mi.toFixed(0):0)+'</b><span>miles logged</span></div></div></div>'+
 '<div class="c"><div class="c-h"><h3>Volume</h3><p>Grey is planned, green is what you logged. '+pct+'% of all sessions ticked.</p></div>'+
  '<div class="chart"><div class="cbars">'+bars+'</div><div class="lgnd"><i><s style="background:var(--soft)"></s>planned minutes</i><i><s style="background:var(--sage)"></s>logged</i></div></div></div>'+
 '<div class="c"><div class="c-h"><h3>Hip trend</h3><p>'+(hips.length?'Last '+Math.min(hips.length,42)+' logged days. Two ambers in a row means hold. Any red means back off a phase and tell your PT.':'Nothing logged yet — score your hip on the Today tab and this fills in.')+'</p></div>'+
  (hips.length?'<div class="chart"><div class="hipr">'+hip+'</div></div>':'')+'</div>';
}

function rCoach(){
 if(window.REVIEW){document.getElementById("p-coach").innerHTML='<div class="c"><div class="c-h"><h3>Ask the coach</h3><p>Not part of this review copy.</p></div><div class="c-p" style="font-size:14.5px;color:var(--ink-2);line-height:1.55">In the live version this tab is a coach that gets the whole plan, the schedule constraints, the hip rules, and every logged session and lifting weight handed to it with each question &mdash; so <i>&ldquo;my hip was a 3 after hockey, should I still do Wednesday?&rdquo;</i> gets an answer grounded in what actually happened, not a generic one.</div></div>';return}

 '<div class="msgs" id="msgs">'+(CHAT.length?CHAT.map(function(m){return '<div class="msg '+m.r+'">'+esc(m.t)+'</div>'}).join(""):

 '<div class="ask"><input id="qin" placeholder="Ask something…" autocomplete="off"><button id="qgo" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button></div></div>';

 var i=CUR,w=W[i],lines=[],lw=[];
 for(var k=Math.max(0,i-2);k<=i;k++)for(var d=0;d<7;d++){var v=st.days["w"+k+"d"+d];if(!v)continue;
  lines.push("W"+(k+1)+" "+DAY[d]+": "+(v.mi?v.mi+"mi ":"")+(v.min?v.min+"min ":"")+(v.hip!=null?"hip"+v.hip+" ":"")+(v.feel?"felt"+v.feel+"/5 ":"")+(v.note||""))}
 ["A","B","C"].forEach(function(sk){["gym","home"].forEach(function(vn){
  lifts(sk,w.b,vn).forEach(function(x,j){var p=lastW(i+1,sk,vn,j);
   if(p)lw.push(sk+(vn==="home"?" (home)":"")+" "+x.n+": "+p.w+" lb (wk "+(p.k+1)+")")})})});
 var hv=[];for(var d2=0;d2<7;d2++)sess(i,d2).forEach(function(o){if(o.L&&venOf(o.id)==="home")hv.push(DAY[d2]+" "+o.L)});
 return "You are Jared's running and strength coach. Answer in 2–4 sentences, direct and specific. No hedging, no bullet lists unless asked. If something is a bad idea, say so plainly.\n\n"+
 "ATHLETE: 28, Boise ID. Bilateral hip labral tears (2023, non-surgical, weekly PT). Robie Creek April 2026 in 2:04 (13.1mi, 2100ft up and down) — about a 1:53 flat half, VDOT 39 — then a long break. NEW to consistent lifting and self-describes as weak: started at 20–25 lb dumbbells for pressing. Goals in order: crush the Robie PR April 17 2027, first marathon, then trail ultras.\n"+
 "SCHEDULE: runs mornings only, showered and ready by 7am, out 5:20 on key days. Remote work 7:30am–5/5:30pm MT. Thursday 5:50–7am run club at Military Reserve (hilly trail, easy). Hockey Tuesday nights starting the week of Sep 28 — counted as hard, and NOTHING hard Tuesday mornings (PT + light primer only, to loosen him up for the game). Gym 5–10 min away, evenings.\n"+
 "WEEK: Mon quality run AM + Strength A (upper bias) PM / Tue PT+primer AM + hockey PM / Wed optional easy 30-40min shakeout AM + Strength B (heavy lower) PM / Thu run club AM / Fri rest AM + Strength C (short) PM / Sat long run / Sun REST. Weekends variable: long run can move to Sunday, in which case Monday goes fully off and the quality work rides the back of the long run.\n"+
 "RULE THAT GOVERNS EVERYTHING: the quality run, hockey and the long run never sit within 24h of each other.\n"+
 "PACES: easy 10:15–11:00 now, 9:45–10:30 by Dec. Threshold 8:25–8:40. Hip rule: joint pain ≤2/10 green, 2–4 hold, >4 or clicking/night pain/next-morning pain = regress a phase.\n"+
 "EQUIPMENT: gym membership, plus one pair of 10 lb dumbbells at home. Every strength session can be switched to a home variant in the app \u2014 dumbbell and bodyweight, same six movement patterns. Home variants progress by reps and tempo, not load, because 10 lb is fixed. He should buy heavier dumbbells (a pair of 20s and 30s, or adjustables) by about week 4 or home training stalls.\n"+
 "FORM: detrained \u2014 has not lifted consistently in over a year and is honest about not knowing proper form on most lifts. He is learning as he goes. Lead with technique cues over load. Never assume he knows a movement name.\n"+
 (hv.length?"SWITCHED TO HOME THIS WEEK: "+hv.join(", ")+"\n":"")+
 "LIFTING: double progression. Hit the top of the rep range on every working set two sessions running, then +5 lb upper / +10 lb lower and back to the bottom of the range. Depth capped at pelvis-neutral on all squats and hinges.\n"+
 "NOW: week "+(i+1)+" of 17 ("+w.f+"), phase "+PH[w.p].n+", block "+w.b+" lifting ("+BLKN[w.b-1]+"), "+w.t+" planned minutes (~"+w.mi+" mi). Today is "+T.toDateString()+".\n"+

  '<tr><td class="k">Sat</td><td><b>Long run</b><br><span class="mono" style="font-size:11px">start by 7:00</span></td><td>—</td></tr>'+
  '<tr><td class="k">Sun</td><td>Rest</td><td>—</td></tr></table></div>'+
  '<div class="note"><b>The rule everything falls out of:</b> the quality run, hockey and the long run never sit within 24 hours of each other. Sunday is rest specifically so Saturday-long → Sunday-off → Monday-quality has 48 hours in it. If you ever need to move something, check it against this and you will get the right answer without asking.</div>'+
  '<h5>Tuesday morning is a primer, not a workout</h5>'+
  '<p>Nothing hard before a game. The hip session plus light activation gets you loose and switched on for the evening at no cost. RPE 6 ceiling. It is also the best possible day for PT — it lands right before the highest-risk hip session of your week.</p>'+
  '<h5>Before hockey starts (weeks 1–3)</h5>'+
  '<p>No hockey until the week of <b>Sep 28</b>, so Tuesday evenings are free. Use them: twenty minutes with an empty bar practising whatever felt wrong on Monday. Three weeks of that before the schedule gets full is worth more than any program tweak.</p>'+
  '<h5>The weekend flexes, Monday absorbs it</h5>'+
  '<p>Long run Saturday by default, Sunday if the weekend goes sideways. If it lands Sunday, <b>Monday goes fully off</b> — not an easy run, off — and that week&rsquo;s quality work rides the back of the long run itself: last 15–20 minutes lifted to moderate. That is arguably more Robie-specific anyway.</p>')+

 acc("Session A · Monday — upper bias",
  '<p class="mono" style="font-size:12px;color:var(--mute)">~50 min · 5:30–6:20pm · warm up 5 min: bike or row easy, then arm circles and band pull-aparts</p>'+
  liftTable("A")+
  '<p>Upper-biased on purpose: you ran hard this morning. Blocks 2 and 4 sit between the columns shown — the app gives you the exact scheme on the day.</p>')+

 acc("Session B · Wednesday — the heavy one",
  '<p class="mono" style="font-size:12px;color:var(--mute)">~55 min · 5:30–6:25pm · warm up 6 min: bike, then bodyweight squats, glute bridges, band walks</p>'+
  liftTable("B")+
  '<p>A full day past hockey, three days clear of the long run — this is the only slot in your week where a heavy lower session doesn&rsquo;t collide with something. The last two exercises only appear in block 4 (weeks 13–17).</p>'+
  '<div class="note red">Every squat and hinge here is capped at the depth where your pelvis stays neutral. Not "as low as you can go." Box squats to a target height are a good self-limiting tool while you learn where that is.</div>')+

 acc("Session C · Friday — short",
  '<p class="mono" style="font-size:12px;color:var(--mute)">~40 min · 5:30–6:10pm · warm up 4 min</p>'+
  liftTable("C")+
  '<p>Deliberately submaximal. The long run is tomorrow morning and it is the priority. If you are ever going to cut a session short, cut this one.</p>')+

 acc("Training at home",
  '<p>Every strength session has a <b>Home</b> version. Tap <b>Gym / Home</b> at the top of the exercise list on the Today tab and the whole session swaps \u2014 same six patterns, so switching never leaves a hole in the week.</p>'+
  '<p>Weights log separately for each, so a 10 lb home row never gets confused with a 25 lb gym row when the app shows you what you lifted last time.</p>'+
  '<h5>Session A at home</h5>'+homeTable("A")+
  '<h5>Session B at home</h5>'+homeTable("B")+
  '<h5>Session C at home</h5>'+homeTable("C")+
  '<div class="note"><b>Reps carry the progression here, not weight.</b> With one fixed pair of dumbbells you cannot add load, so the home schemes climb in reps and add tempo \u2014 three seconds down, a pause at the top. That works for a while and then stops working.</div>'+
  '<div class="note red"><b>Buy heavier dumbbells by about week 4.</b> A pair of 20s and a pair of 30s, or one adjustable pair, covers this whole block. Ten pounds is a fine place to learn a pattern and a bad place to spend seventeen weeks \u2014 the point of the block is to get stronger, and at some stage that needs load.</div>'+
  '<div class="note grn"><b>Home is not the lesser option while you are learning.</b> No one is waiting for your rack, so you can take three minutes between sets and film every one. Weeks 1\u20134 are a skills block; your living room is arguably the better classroom.</div>')+

 acc("How the weight goes up",
  '<div class="scrl"><table><tr><th>Weeks</th><th>Main lifts</th><th>Effort</th></tr>'+
  '<tr><td class="v">1–4</td><td>3 × 10–12</td><td>RPE 6–7 — 3–4 reps left in the tank</td></tr>'+
  '<tr><td class="v">5–8</td><td>4 × 8–10</td><td>RPE 7–8 — 2–3 left</td></tr>'+
  '<tr><td class="v">9–12</td><td>4 × 5–6</td><td>RPE 8 — 2 left. Real strength work</td></tr>'+
  '<tr><td class="v">13–17</td><td>4 × 5</td><td>RPE 8 + pogos and eccentrics Wednesday</td></tr></table></div>'+
  '<h5>Double progression — the only rule you need</h5>'+
  '<p>Hit the <b>top of the rep range on every working set, two sessions in a row</b>. Then add weight and drop back to the bottom of the range.</p>'+
  '<ul><li>Upper body: <b>+5 lb</b> (so 20 lb dumbbells → 25 lb)</li><li>Lower body: <b>+10 lb</b> on the bar</li></ul>'+
  '<p>Example: you press the 20s for 3×10 in week 1. Week 2 you get 3×12. Week 3 you get 3×12 again — that&rsquo;s two in a row, so week 4 you move to the 25s and start over at 3×10.</p>'+
  '<div class="note grn"><b>Where this lands you.</b> At roughly one jump every three or four weeks across seventeen weeks, you finish the block pressing something like the 35s for reps and pulling 155–185 on the trap bar. Not impressive to anyone else. Completely transformative for a runner who has never lifted consistently — and that gap is exactly what the running-economy research is measuring.</div>'+
  '<div class="note"><b>When a weight feels too light, it probably is.</b> The most common beginner mistake is not going too heavy — it is spending four months at the weight you started with because it feels productive. If you finish every set knowing you had five more, add weight the same session.</div>')+

 acc("Your paces",
  '<p>Anchored off 2:04 at Robie — about a 1:53 flat half, VDOT 39. You are detrained, so start at the slow end.</p>'+
  '<div class="scrl"><table><tr><th>Zone</th><th>Pace</th><th>Feels like</th></tr>'+
  '<tr><td class="k">Easy now</td><td class="v">10:15–11:00</td><td>Full sentences, boring on purpose</td></tr>'+
  '<tr><td class="k">Easy by Dec</td><td class="v">9:45–10:30</td><td>Same effort, faster clock</td></tr>'+
  '<tr><td class="k">Threshold</td><td class="v">8:25–8:40</td><td>Ten-word answers, not sentences</td></tr>'+
  '<tr><td class="k">Strides</td><td class="v">~7:00 feel</td><td>Fast and loose, never a sprint</td></tr>'+
  '<tr><td class="k">Hill sprints</td><td class="v">8–10s</td><td>~98% on 5–7% grade, walk all the way down</td></tr></table></div>'+
  '<div class="note"><b>Week 7 re-anchors everything.</b> 15 min easy, then 20 min at the hardest pace you could hold for exactly twenty. Flat road. Average pace + 25–30 sec/mi is your new easy; the average itself is close to your new threshold.</div>')+

 acc("Hip triage",
  '<p>Labral pain is joint pain, not tendon pain. The tolerance is tighter than the &ldquo;run through a 5/10&rdquo; rule you will read online.</p>'+
  '<div class="tri"><i style="background:var(--sage)"></i><div><b>0–1 · Green — progress</b><span>Gone within a few hours, nothing next morning, no clicking. Add load or range as planned.</span></div></div>'+
  '<div class="tri"><i style="background:var(--gold)"></i><div><b>2–3 · Amber — hold</b><span>Or morning stiffness that clears by midday. Repeat this week&rsquo;s numbers instead of advancing. No new exercises.</span></div></div>'+
  '<div class="tri"><i style="background:var(--clay)"></i><div><b>4 · Red — regress</b><span>New catching, locking or giving way. Pain still there next morning. Night ache. Character shifts from dull to sharp pinch. Drop back a phase and raise it at your next PT session — not in three weeks.</span></div></div>'+
  '<div class="note red"><b>About hockey.</b> Skating is sustained deep hip flexion, and hard pivoting on a planted flexed hip is the single position most associated with labral irritation — it is the clinical impingement test. Not a reason to quit; a reason to name it. If a flare shows up, hockey is the first thing to look at, not the running.</div>')+

 acc("What the hips don't get",
  '<h5>Skip or modify</h5><ul><li>Squatting past pelvis-neutral — the butt-wink is your bony end range</li><li>Deep leg press, feet low</li><li>Box step-ups above knee height</li><li>Walking and deep lunges</li><li>Kneeling hip-flexor stretching, pigeon pose</li><li>Sit-ups and crunches</li><li>Hard pivoting on a planted flexed hip</li></ul>'+
  '<h5>Reach for instead</h5><ul><li>Front or goblet squat over back squat</li><li>Trap-bar or sumo over conventional</li><li>Hip thrusts — extension, no flexion cost</li><li>Static split squats over walking lunges</li><li>Anti-rotation core: Pallof, dead bug, bird dog</li><li>Active hip-flexor strength, not passive stretch</li></ul>'+
  '<div class="note">Nudge cadence up 5–10% over whatever it naturally is, measured on flat ground, with a watch alert. Not 180. Beyond 10% you just spend more energy.</div>')+

 acc("Trail and power-hiking",
  '<h5>Saturday migrates to dirt</h5><p>Weeks 1–4 stay on road while you rebuild. From week 5 the long run goes to the foothills — Ridge to Rivers starts at the end of your street. Softer surface, less repetitive loading, and Robie&rsquo;s back half is dirt, so the specificity is free.</p>'+
  '<h5>Power-hiking is a trained skill</h5>'+
  '<p>Above roughly 10–12% grade, most runners at your fitness move faster hiking with hands on quads than shuffle-running, at a lower heart rate. That is not quitting. In ultras it is the entire sport, and at Robie the steep pitch before Aldape is exactly where people burn the race.</p>'+
  '<p><b>Train it:</b> on Thursday&rsquo;s climb and every trail Saturday, deliberately hike the steepest pitch — hands on quads, short quick steps, drive from the hip. Time it against running the same pitch once a month.</p>'+
  '<div class="note"><b>Technical terrain comes later.</b> Uneven footing means unplanned hip rotation, the pattern your labrum likes least. Smooth, consistent-grade trail all winter. Rocky stuff in spring, once the strength block is behind you.</div>')+

 acc("When you miss one",
  '<p>You will miss sessions. The plan assumes it. What breaks people is what they do next.</p>'+
  '<h5>Missed Monday&rsquo;s quality run</h5><p>Skip it, or take it on the back of the weekend long run. <b>Never move it to Tuesday or Wednesday</b> — Tuesday competes with hockey and Wednesday is eight hours after it.</p>'+
  '<h5>Missed the long run</h5><p>Sunday at 80% of the planned time. If the whole weekend is gone, let it go and do <b>not</b> inflate next week — that spike is the best-evidenced way to get hurt.</p>'+
  '<h5>Missed a lift</h5><p>Ten-minute minimum, same day, before you get home: goblet squat 2×10, push-up 2×10, DB row 2×10, dead bug 2×10. Tick the box. That is the whole rule.</p>'+
  '<h5>Missed a week</h5><p>Repeat it rather than jumping forward. Three or more weeks off: go back two weeks and rebuild.</p>'+
  '<div class="note grn"><b>Never miss twice.</b> One skipped session is a Tuesday. Two in a row is a new habit. Weeks 1–10 are supposed to feel effortful — automaticity takes about ten weeks and that is normal, not a sign the plan is wrong.</div>')+

 acc("Winter, dark, sleep, fuel",
  '<h5>The thing that actually breaks this</h5>'+
  '<p>Up at 5:00, hockey some nights, gym others. Lights out by 9:30, and it is not optional — the plan is built on recovery you only get asleep. If bedtime slips past 10:30 more than twice a week, cut a session before you cut sleep.</p>'+
  '<h5>December mornings</h5>'+
  '<ul><li>Headlamp with a fresh battery, plus something reflective. Dark until past 8am.</li><li>Traction — Yaktrax or similar — in the car from November. Ice is the injury, not the cold.</li><li>Three layers, shell off for the hard part. Sweat trapped under a shell is what makes you cold afterwards.</li><li>Below freezing: warm up 15–18 minutes before anything hard.</li></ul>'+
  '<div class="note">Ice beats every other consideration. Move hill sprints and threshold to a treadmill at 1% rather than risk a slip at speed. That is the correct call, not a compromise.</div>'+
  '<h5>Fuel — only two things matter</h5>'+
  '<p><b>Runs over 75 minutes:</b> 30–60g of carbs an hour, starting around 40 minutes in. Practise it on trail Saturdays. Gut training is real and takes months.</p>'+
  '<p><b>The 30 minutes after lifting:</b> 30–40g protein plus carbs. You are asking a body to build muscle and aerobic capacity at once on limited hours — under-eating is the quietest way that fails.</p>')+

 acc("Key dates and what comes after",
  '<h5>Feb 15 2027, 12:00pm MT</h5><p>Robie registration, Presidents&rsquo; Day. 2,100 spots, historically gone in about ten minutes. <b>Set two alarms.</b> Everything else is downstream of this.</p>'+
  '<h5>Jan 4 2027</h5><p>15-week Robie build. VO2max intervals enter here and not a day sooner. Downhill repeats start in March.</p>'+
  '<h5>Apr 17 2027 — Robie</h5><p>Off ~27 mi/wk of base plus a real build, <b>sub-1:55 is a fair ask</b> — nine minutes on this year. Pace by effort to Aldape, hike the steep pitch, hold something back for a descent that will take more out of you than the climb did.</p>'+
  '<h5>The marathon</h5>'+
  '<p>Needs a fifth running day. Four gets you to the start line and not through mile 20. The fifth is Wednesday morning, easy — but it only goes in once Wednesday&rsquo;s lift is no longer the week&rsquo;s heaviest, or once hockey&rsquo;s season ends and Tuesday frees up.</p>'+
  '<p>So: <b>Robie in April → three easy weeks → add Wednesday → build through summer → marathon in October.</b> City of Trees in Boise is the low-friction one. Pocatello in early September if you want flatter and faster.</p>'+
  '<h5>Then trail ultras</h5><p>Sun Mountain 50K as the stepping stone, then White River 50 or Bighorn. Ultras are a volume problem and volume is what your schedule limits — solve days five and six before picking a date.</p>')+

 acc("Where this came from",
  '<p style="font-size:13px;color:var(--mute);line-height:1.6">Polarized distribution and the cost of crossing VT1 — Cerezuela-Espejo 2024 (<i>Sports Medicine</i>) and Rønnestad 2022, whose pyramidal→polarized sequencing is the shape of this block. Talk-test validity — Persinger 2004. Volume progression — Nielsen&rsquo;s systematic review (the 10% rule is not a real threshold; large single-week spikes are) and the 0.8–1.3 acute:chronic band. Conservative FAI management — the Warwick Agreement, the 2023 non-operative outcomes review, Grimaldi &amp; Fearon <i>JOSPT</i> 2015. Strength for runners — 2024 <i>Sports Medicine</i> meta-analysis (heavy ≥80% 1RM; none of it moves VO2max) and a 2025 RCT on durability where economy decay over 90 minutes fell from 4.7% to 2.1%. Concurrent training — 2025 Frontiers review: AMPK needs ~3 hours to clear, so a 5am/5:30pm split has no interference cost. Downhill — 2020 <i>Sports Medicine</i> review: knee-extensor strength drops 14–55% after a downhill bout and stays down 4–5 days. Adherence — Milne, Orbell &amp; Sheeran 2002; Lally 2010.</p>');
 document.querySelectorAll("#p-plan .ac-h").forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle("open")}});
}

 var vb=e.target.closest("[data-ven]");
 if(vb){var wrap=vb.closest("[data-vs]");

 var d=e.target.closest("[data-done]");

 var h=e.target.closest("#f-hip .sc");if(h){setf("hip",+h.dataset.h);return}
 var f=e.target.closest("#f-feel .sc");if(f){setf("feel",+f.dataset.f);return}});

 if(t.dataset&&t.dataset.exw!=null){var kk=t.dataset.exw,o=st.lift[kk]||(st.lift[kk]={});
  if(t.value==="")delete o.w;else o.w=t.value;

 if(t.id==="f-mi")setf("mi",t.value===""?null:+t.value);
 else if(t.id==="f-min")setf("min",t.value===""?null:+t.value);
 else if(t.id==="f-note")setf("note",t.value);});
function setf(k,v){
 if(!LIVE)return;
 var key="w"+CUR+"d"+TD,o=st.days[key]||(st.days[key]={});
 if(v===null||v==="")delete o[k];else o[k]=v;
 if(!Object.keys(o).length)delete st.days[key];
 save();
 var s=document.getElementById("f-saved");if(s){s.textContent="saved";clearTimeout(s._t);s._t=setTimeout(function(){s.textContent=""},1400)}
 if(k==="hip"||k==="feel"){var wrap=document.getElementById(k==="hip"?"f-hip":"f-feel");
  wrap.querySelectorAll(".sc").forEach(function(b){b.classList.toggle("on",+(b.dataset.h!=null?b.dataset.h:b.dataset.f)===v)})}}

rToday();rWeek();rProg();rCoach();rPlan();

(async function(){
